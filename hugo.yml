    title: "Haneen Alharbi"
    subtitle: "اهلًا، معكم طالب يدرس تخصص الأمن السيبراني من الدفعة الأولى في جامعة طيبة، يواجه العديد من التحديات في رحلة دراسته ويشارككم مراجعه ونصائحه. التواصل بخصوص أي شي في القناة على الايميل المرفق في وصف القناة.\n\"اللهم إنّا نعوذ بك من فتنة القول كما نعوذ بك من فتنة العمل، ونعوذ بك من التكلف لما لا نُحسن كما نعوذ بك من العُجب بما نُحسن، ونعوذ بك من السلاطة والهذر، كما نعوذ بك من العيّ والحصر.\"" 
  socialIcons:
